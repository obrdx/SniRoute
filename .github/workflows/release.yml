# 发布流程：推送 v* 标签即自动构建并创建 GitHub Release。
# 产物命名 sniroute_{os}_{arch} 与部署脚本的下载地址模板保持一致：
#   https://github.com/obrdx/SniRoute/releases/latest/download/sniroute_{os}_{arch}
# 部署脚本（scripts/sniroute-{server,client}.sh）不指定 SR_BIN 时会获取最新 Release。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Verify fixed application version
        run: test "$(go run ./cmd/sniroute version)" = "1.0.0"

      - name: Build binaries
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w" \
                -o "dist/sniroute_${os}_${arch}" ./cmd/sniroute
            done
          done

      - name: Checksums
        run: |
          cd dist
          sha256sum sniroute_* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SniRoute $GITHUB_REF_NAME" \
            --generate-notes
